[server]
public_port = 8080          # Public HTTP port (receives from nginx/ingress)
tunnel_port = 8443          # gRPC port for tunnel clients

# You can use environment variables with the syntax ${VAR_NAME}
# Example: private_key = "${SERVER_PRIVATE_KEY}"
private_key = "axjhCqieuY3cU6qpRA48FSjKlojaH5+Q5kjm5aLwdfc="  # Server private key

# Optional: Native TLS on tunnel_port (if not using ingress)
# [server.tls]
# enabled = false
# cert_path = "/path/to/cert.pem"
# key_path = "/path/to/key.pem"

# List of authorized clients (one per developer)
# You can also use environment variables here
[[peers]]
public_key = "ZlsOtT/650gpT8XrPzNJOT4yyuJoYfngRnbRBBHknYE="  # or "${CLIENT_PUBLIC_KEY}"
domain = "dev1.example.com"

