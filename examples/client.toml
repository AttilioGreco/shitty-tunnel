[client]
# Server hostname or URL
# Option 1: Full URL (recommended) - server_port optional
#   server_host = "https://tunnel.example.com:443"
#   server_host = "http://tunnel.example.com:8088"
# Option 2: Separate host + port (auto-detect http/https)
#   server_host = "tunnel.example.com"
#   server_port = 443  # required if server_host is not a full URL
server_host = "tunnel.example.com"
server_port = 8443

# You can use environment variables with the syntax ${VAR_NAME}
# Example: private_key = "${CLIENT_PRIVATE_KEY}"
#          server_public_key = "${SERVER_PUBLIC_KEY}"
private_key       = ""  # Client private key
server_public_key = ""  # Server public key

[local]
host = "127.0.0.1"
port = 3000  # Port of your local service
basic_auth = ""  # Basic authentication credentials (optional)

# Headers to inject (or overwrite) on every proxied request AND response (optional)
# [local.add_headers]
# "X-Forwarded-By" = "shittyTunnel"
# "X-Environment" = "production"

# Headers to strip from every proxied request AND response (optional)
# [local.remove_headers]
# names = ["Authorization", "Cookie", "X-Internal-Secret"]

[reconnect]
enabled = true
initial_delay_ms = 1000
max_delay_ms = 30000  # Exponential backoff: 1s, 2s, 4s, 8s, 16s, 30s...

# ─── Inspector Dashboard ──────────────────────────────────────────────────────
# Embedded web UI that shows all proxied requests in real-time.
# Open http://localhost:3000 in your browser while the client is running.
#
# The dashboard is served directly by the client binary — no separate install.
#
[dashboard]
enabled = true
port = 3000       # Dashboard listens on this port (localhost only)
max_events = 500  # How many requests to keep in the circular buffer
