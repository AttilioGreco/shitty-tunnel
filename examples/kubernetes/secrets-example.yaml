# Example secrets - DO NOT commit this file with real keys!
# Generate keys with: docker run --rm ghcr.io/attiliogreco/shitty-tunnel:latest keygen

# Create secret with kubectl:
# kubectl create secret generic shitty-tunnel-server-keys \
#   --from-literal=private-key='your-server-private-key' \
#   -n shitty-tunnel

---
apiVersion: v1
kind: Secret
metadata:
  name: shitty-tunnel-server-keys
  namespace: shitty-tunnel
type: Opaque
stringData:
  # Server private key (generate with keygen command)
  private-key: "REPLACE_WITH_YOUR_SERVER_PRIVATE_KEY"
