[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Whether to consider the binaries in a package for distribution (defaults true)
dist = true
# Whether to auto-include files like READMEs, LICENSEs, and CHANGELOGs (default true)
auto-includes = true
# Which actions to run on pull requests
pr-run-mode = "skip"
# Path strategy for shell/powershell installers:
# 1) SHITTY_TUNNEL_INSTALL_DIR override
# 2) Linux-friendly user bin default
# 3) CARGO_HOME fallback
install-path = ["$SHITTY_TUNNEL_INSTALL_DIR/", "~/.local/bin"]
# Whether to install an updater program
install-updater = true

# Use native ARM runners instead of QEMU for aarch64 Linux targets
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"

# System dependencies needed for build
[dist.dependencies.homebrew]
protobuf = '*'
node = '*'

[dist.dependencies.apt]
protobuf-compiler = '*'
libssl-dev = '*'
pkg-config = '*'
nodejs = '*'
npm = '*'

[dist.dependencies.chocolatey]
protoc = '*'
nodejs-lts = '*'
bun = '*'

[[dist.extra-artifacts]]
build = ["bash", "-lc", "mkdir -p target/dist-extra/systemd && cp packaging/systemd/shitty-tunnel-client.service packaging/systemd/shitty-tunnel-server.service target/dist-extra/systemd/"]
artifacts = [
	"target/dist-extra/systemd/shitty-tunnel-client.service",
	"target/dist-extra/systemd/shitty-tunnel-server.service",
]

[[dist.extra-artifacts]]
build = ["bash", "-lc", "mkdir -p target/dist-extra/scripts && cp scripts/install-client.sh scripts/install-server.sh target/dist-extra/scripts/"]
artifacts = [
	"target/dist-extra/scripts/install-client.sh",
	"target/dist-extra/scripts/install-server.sh",
]
