services:
  # Traefik v3 - Reverse Proxy
  traefik:
    image: traefik:v3
    container_name: shitty-traefik
    restart: unless-stopped
    ports:
      - "5000:5000"   # Entrypoint 1: simulazione lato server (traffico tunnelato)
      - "4000:4000"   # Entrypoint 2: client dashboard (frontend + /api)
      # - "8081:8081"   # Dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - shitty-tunnel-net

  # shittyTunnel Server (con hot-reload)
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: shitty-server
    volumes:
      - .:/app:cached
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
      - ./docker/server.toml:/etc/shittyTunnel/server.toml:ro
    environment:
      - RUST_LOG=info,shitty_tunnel=debug
      - CARGO_WATCH_ARGS=server --config /etc/shittyTunnel/server.toml
    networks:
      - shitty-tunnel-net

  # shittyTunnel Client (con hot-reload) - esporrà /api su :3001
  client:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: shitty-client
    volumes:
      - .:/app:cached
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
      - ./docker/client.toml:/etc/shittyTunnel/client.toml:ro
    environment:
      - RUST_LOG=info,shitty_tunnel=debug
      - CARGO_WATCH_ARGS=client --config /etc/shittyTunnel/client.toml
    depends_on:
      - server
    networks:
      - shitty-tunnel-net

  # Client dashboard frontend (TanStack Start + Vite, dev su :3000)
  client-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: shitty-client-frontend
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    networks:
      - shitty-tunnel-net

  # App di test HTTP
  whoami:
    image: traefik/whoami:latest
    container_name: shitty-whoami
    environment:
      - WHOAMI_PORT_NUMBER=80
      - WHOAMI_NAME=TestApp
    networks:
      - shitty-tunnel-net

networks:
  shitty-tunnel-net:
    driver: bridge

volumes:
  cargo-cache:
  target-cache:
