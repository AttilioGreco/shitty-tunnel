syntax = "proto3";

package tunnel;

service ShittyTunnel {
    // Bidirectional streaming: client authenticates then exchanges HTTP traffic
    rpc OpenTunnel(stream ClientMessage) returns (stream ServerMessage);
}

message ClientMessage {
    oneof msg {
        AuthRequest auth_request = 1;
        HttpResponse http_response = 2;
        Pong pong = 3;
    }
}

message ServerMessage {
    oneof msg {
        AuthResponse auth_response = 1;
        HttpRequest http_request = 2;
        Ping ping = 3;
        Disconnect disconnect = 4;
    }
}

message AuthRequest {
    bytes public_key = 1;
    uint64 timestamp = 2;
    bytes signature = 3;
}

message AuthResponse {
    bool success = 1;
    string domain = 2;
    bytes server_public_key = 3;
    bytes server_signature = 4;
}

message HttpRequest {
    uint64 request_id = 1;
    string method = 2;
    string uri = 3;
    repeated HttpHeader headers = 4;
    bytes body = 5;
}

message HttpResponse {
    uint64 request_id = 1;
    uint32 status = 2;
    repeated HttpHeader headers = 3;
    bytes body = 4;
}

message HttpHeader {
    string name = 1;
    string value = 2;
}

message Ping {
    uint64 nonce = 1;
}

message Pong {
    uint64 nonce = 1;
}

message Disconnect {
    string reason = 1;
}
