[package]
name = "shitty-tunnel"
version.workspace = true
edition.workspace = true
description = "Self-hosted HTTP tunnel"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/shittyTunnel"
homepage = "https://github.com/yourusername/shittyTunnel"
keywords = ["tunnel", "reverse-proxy", "grpc"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "shitty-tunnel"
path = "src/main.rs"

[dependencies]
st-domain = { workspace = true }
st-protocol = { workspace = true }
st-infra = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
axum = { workspace = true }
http-body-util = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
toml = { workspace = true }
url = { workspace = true }

# Metadata for cargo-dist installers
[package.metadata.dist]
# Include example configs in releases
dist-include = [
    "../../examples/server.toml",
    "../../examples/client.toml",
    "../../examples/README.md",
]

[package.metadata.wix]
upgrade-guid = "155D5767-E1B6-4938-990F-BA3279F64974"
path-guid = "045353CE-856C-4392-A9E8-B1685045360D"
license = false
eula = false
